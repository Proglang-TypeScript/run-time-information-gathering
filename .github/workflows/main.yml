name: build

on: [push]

jobs:
  audit:
    runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Audit dependencies
        run: npm audit

  lint:
    runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm i
      - name: Lint
        run: npm run lint
